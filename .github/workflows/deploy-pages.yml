name: Deploy GitHub Pages with CARTO_API_KEY

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inject CARTO_API_KEY and build index.html
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          printf 'window.LOCAL_MAP_CONFIG = { cartoKey: %s };\n' "$(node -e 'console.log(JSON.stringify(process.env.CARTO_API_KEY || ""))')" > local-config.js
          node build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
